#docker compose file for the project using mysql and mongodb

version: '3'
services:
  db:
    image: mysql:8.0
    ports:
      # Host 3307 avoids conflict when MySQL is already running on 3306 locally.
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: urbanoak
    volumes:
      - mysql_data:/var/lib/mysql 
  mongodb:
    image: mongo:latest
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db


volumes:
  mysql_data:
  mongodb_data: