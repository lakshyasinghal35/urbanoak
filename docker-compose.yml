#docker compose file for the project using mysql and mongodb

version: '3'
services:
  db:
    image: mysql:8.0
    ports:
      # Host 3307 avoids conflict when MySQL is already running on 3306 locally.
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: urbanoak
    volumes:
      - mysql_data:/var/lib/mysql
  mongodb:
    image: mongo:latest
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db
  redis:
    image: redis:7-alpine
    # Use REDIS_URL=redis://redis:6379 from other containers in this compose network.
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
  elasticsearch:
    # Run x86_64 image via emulation to avoid ARM JVM SIGILL crashes on some local Docker setups.
    platform: linux/amd64
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - 9200:9200
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data


volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  elasticsearch_data: